name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest changelog
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          changelog = Path("src/changelog.md").read_text(encoding="utf-8-sig")

          # Find release headings such as:
          # **### 08-10-2026 - 1.0.09**
          heading = re.compile(
              r"^\s*\**###\s+\d{2}-\d{2}-\d{4}\s+-\s+[^\s*]+\**\s*$",
              re.MULTILINE,
          )

          matches = list(heading.finditer(changelog))

          if not matches:
              raise SystemExit(
                  "Could not find a release heading in src/changelog.md"
              )

          # First heading = latest release
          latest = matches[0]

          # Content after the latest heading
          start = latest.end()

          # Stop at the next release heading
          end = matches[1].start() if len(matches) > 1 else len(changelog)

          latest_changelog = changelog[start:end].strip()

          if not latest_changelog:
              raise SystemExit(
                  "The latest changelog section is empty."
              )

          Path("latest-changelog.md").write_text(
              latest_changelog + "\n",
              encoding="utf-8",
          )

          print("Latest changelog:")
          print(latest_changelog)
          PY

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          files: dist/*.jar
          loaders: |
            fabric
            neoforge

          modrinth-id: IqCPvv9e
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          version-type: alpha
          changelog-file: latest-changelog.md
